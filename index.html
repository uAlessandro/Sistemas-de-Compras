<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Compras</title>
    <link rel="stylesheet" href="style.css">

    
</head>
<body>
    <main>
       <h1>Lista de Compras</h1>
       
       <button class="categoria" id="vendas">
        <span class="icone">🛍️ </span>
        <span class="h2">Produtos para Venda</span>
        
       </button>

       <button class="categoria" id="fabricacao">
         
        <span class="icone">🏭</span>
        <span class="h2">Produtos para Fabricação</span>
       </button>

        <div id="cadastro">
        <h2>Cadastrar Produto</h2>

            <input type="text" id="nomeProduto" placeholder="Nome do produto">

            <select id="categoriaProduto">
                <option value="vendas">Produtos para Venda</option>
                <option value="fabricacao">Produtos para Fabricação</option>
            </select>

            <button id="adicionarProduto">Adicionar Produto</button>
        </div>

        

        <div id="conteudo"></div>
       
       
       



    </main>

    <script src="script.js"></script>

    

    
</body>
</html>
